# Fork-only iOS compile check, run when scripts/precheck.py reports a native change.
# Tests and analyze run locally in precheck, so this only proves `flutter build ios`.
name: iOS compile check

on:
  workflow_dispatch:

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          # Restoring the 2.2 GB SDK takes as long as installing it, and a miss adds
          # a minute of saving; feature-branch caches can't be read from main anyway.
          cache: false

      - run: flutter pub get

      - run: brew install cmake ninja

      - name: Build
        run: flutter build ios --release --no-codesign
