# Fork-only public release: Android arm64 APK + Windows portable zip + unsigned iOS IPA, published as a
# GitHub Release on this repo. This is the only file that passes KAZUMI_PUBLIC; the
# TestFlight build (testflight.yaml, and codemagic.yaml as its fallback) never does.
# Upstream's release.yaml is disabled on the fork (gh workflow disable release.yaml),
# and scripts/public_check.py --static
# fails the run if it, or any other push/release-triggered workflow, is enabled.
#
#   gh workflow run public-release.yaml -R KaiC5504/Kazumi --ref main \
#     -f version=3.0.0 -F notes=@notes.txt -f draft=true
name: public-release
run-name: public-release ${{ inputs.version }}${{ inputs.draft && ' (draft)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Public version X.Y.Z (the in-app updater int-parses the tag)"
        required: true
        type: string
      notes:
        description: "Release notes, short Chinese bullets one per line (shown in the update dialog)"
        required: true
        type: string
      draft:
        description: "Create a draft; publish later with gh release edit"
        required: false
        type: boolean
        default: true

concurrency:
  group: public-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  # Visible name only. Hidden ids (package, bundle id, CompanyName/ProductName, mutex)
  # stay as they are: ProductName names the Windows data dir.
  APP_NAME: Kazumi Plus
  # branding/public/ mirrors these repo paths; CI copies it over the checkout only.
  # Android 8+ draws drawable-*/ic_launcher_foreground.png (adaptive icon); mipmap-* is
  # the legacy launcher and the reminder notification icon.
  ICON_PATHS: >-
    android/app/src/main/res/drawable-mdpi/ic_launcher_foreground.png
    android/app/src/main/res/drawable-hdpi/ic_launcher_foreground.png
    android/app/src/main/res/drawable-xhdpi/ic_launcher_foreground.png
    android/app/src/main/res/drawable-xxhdpi/ic_launcher_foreground.png
    android/app/src/main/res/drawable-xxxhdpi/ic_launcher_foreground.png
    android/app/src/main/res/mipmap-mdpi/ic_launcher.png
    android/app/src/main/res/mipmap-hdpi/ic_launcher.png
    android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
    android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
    android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
    windows/runner/resources/app_icon.ico
    assets/images/logo/logo_lanczos.ico
    assets/images/logo/logo_rounded.png
    assets/images/logo/logo_android.png
    assets/images/logo/logo_ios.png
    assets/images/logo/logo_linux.png
    assets/images/logo/logo_windows.ico

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      flutter_version: ${{ steps.flutter.outputs.version }}
      branded: ${{ steps.branding.outputs.branded }}
    steps:
      - uses: actions/checkout@v4

      # flutter-action's flutter-version-file needs yq, which Windows gets from
      # Chocolatey; its feed times out often enough to fail releases.
      - id: flutter
        name: Flutter version from pubspec.yaml
        run: |
          version=$(sed -n 's/^  flutter: *\([0-9][0-9.]*\) *$/\1/p' pubspec.yaml | head -1)
          if [ -z "$version" ]; then
            echo "::error file=pubspec.yaml::no 'flutter: X.Y.Z' under environment"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: version
        name: Version is X.Y.Z and not taken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::version must be X.Y.Z with Y and Z below 100, got '$VERSION'"
            exit 1
          fi
          build_number=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          # Public and TestFlight builds share one version line since 3.2.0.
          testflight=$(sed -n 's/.*--build-name=\([0-9][0-9.]*\).*/\1/p' .github/workflows/testflight.yaml | head -1)
          if [ "$VERSION" != "$testflight" ]; then
            echo "::error::version $VERSION isn't the TestFlight build's ($testflight in .github/workflows/testflight.yaml); bump them together"
            exit 1
          fi
          # The fork carries all of upstream's tags; never publish onto one of them.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi
          # A read token can't see drafts; the release job re-checks with a write token.
          if gh release view "$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $VERSION already exists"
            exit 1
          fi
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: A published release comes from main
        if: ${{ !inputs.draft }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::dispatch a non-draft release from main (partner_check gates main), got $GITHUB_REF"
            exit 1
          fi

      - name: Static guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/public_check.py --static

      - id: branding
        name: Branding is only icons, and all or none of them
        run: |
          allowed=" $ICON_PATHS android/app/src/main/res/values/colors.xml "
          if [ -d branding/public ]; then
            while IFS= read -r f; do
              case "$allowed" in
                *" ${f#branding/public/} "*) ;;
                *) echo "::error file=$f::not an icon path; branding/public/ may only replace icons"; exit 1 ;;
              esac
            done < <(find branding/public -type f)
          fi
          missing=0
          for p in $ICON_PATHS; do
            [ -f "branding/public/$p" ] || { echo "missing branding/public/$p"; missing=$((missing + 1)); }
          done
          if [ "$missing" = 0 ]; then
            echo "branded=true" >> "$GITHUB_OUTPUT"
          elif [ "$missing" = 17 ]; then
            echo "no branding/public/: ships upstream's icon"
            echo "branded=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::branding/public/ is missing $missing of 17 icons; add all of them or none"
            exit 1
          fi

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Public icon
        if: needs.check.outputs.branded == 'true'
        run: |
          cp -r branding/public/. .
          # The binary scan can't see images; this is the only proof the swap happened.
          for p in $ICON_PATHS; do
            if [ "$(git hash-object "$p")" = "$(git rev-parse "HEAD:$p")" ]; then
              echo "::error file=$p::still upstream's icon after the copy"
              exit 1
            fi
          done

      - name: Public identity (installs beside upstream Kazumi)
        run: |
          expect() { grep -qF -- "$2" "$1" || { echo "::error file=$1::'$2' not found after patching; did upstream change this line?"; exit 1; }; }
          sed -i 's/applicationId "com\.predidit\.kazumi"/applicationId "com.kaichuan.kazumi"/' android/app/build.gradle
          expect android/app/build.gradle 'applicationId "com.kaichuan.kazumi"'

          sed -i "s/android:label=\"Kazumi\"/android:label=\"$APP_NAME\"/" android/app/src/main/AndroidManifest.xml
          expect android/app/src/main/AndroidManifest.xml "android:label=\"$APP_NAME\""
          # The recents screen shows MaterialApp's title.
          sed -i "s/title: \"Kazumi\",/title: \"$APP_NAME\",/" lib/app_widget.dart
          expect lib/app_widget.dart "title: \"$APP_NAME\","

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: ${{ needs.check.outputs.flutter_version }}
          cache: true

      - run: flutter pub get

      - name: Build
        env:
          BUILD_NUMBER: ${{ needs.check.outputs.build_number }}
          # A separate DanDanPlay app from her TestFlight build, so abuse can't get hers disabled.
          DANDANAPI_APPID: ${{ secrets.PUBLIC_DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.PUBLIC_DANDANAPI_KEY }}
        run: >-
          flutter build apk --release --split-per-abi --target-platform android-arm64
          --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          --dart-define=KAZUMI_PUBLIC=true
          --dart-define=KAZUMI_LIBRARY_SERVER=
          --dart-define=DANDANAPI_APPID="$DANDANAPI_APPID"
          --dart-define=DANDANAPI_KEY="$DANDANAPI_KEY"

      - name: Sign with the public keystore
        env:
          KEYSTORE_B64: ${{ secrets.PUBLIC_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.PUBLIC_KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.PUBLIC_KEY_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_STORE_PASSWORD" ]; then
            echo "::error::PUBLIC_KEYSTORE_B64, PUBLIC_KEY_ALIAS and PUBLIC_KEY_STORE_PASSWORD must be set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/public.jks"
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          # Gradle signs release builds with the debug key; apksigner replaces it.
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/public.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD --key-pass env:KEY_STORE_PASSWORD \
            --out "KazumiPlus_android_$VERSION.apk" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          rm -f "$RUNNER_TEMP/public.jks"
          # Compared with the SHA-256 of the keystore backup.
          "$bt/apksigner" verify --print-certs "KazumiPlus_android_$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: KazumiPlus_android_*.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: check
    runs-on: windows-latest   # image windows-2025-vs2026: ech_http needs MSVC from VS 2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Public icon
        if: needs.check.outputs.branded == 'true'
        shell: bash
        run: |
          cp -r branding/public/. .
          for p in $ICON_PATHS; do
            if [ "$(git hash-object "$p")" = "$(git rev-parse "HEAD:$p")" ]; then
              echo "::error file=$p::still upstream's icon after the copy"
              exit 1
            fi
          done

      # path_provider_windows builds the data dir from the exe's CompanyName/ProductName,
      # so this moves everything to %APPDATA%\KazumiFork\kazumi. Never change the mutex
      # without the data dir: two apps would open the same Hive boxes.
      - name: Public identity (own data dir, mutex and name)
        shell: bash
        run: |
          expect() { grep -qF -- "$2" "$1" || { echo "::error file=$1::'$2' not found after patching; did upstream change this line?"; exit 1; }; }
          reject() { if grep -qE -- "$2" "$1"; then echo "::error file=$1::'$2' still present after patching"; exit 1; fi; }

          rc=windows/runner/Runner.rc
          sed -i 's/"CompanyName", "com\.example"/"CompanyName", "KazumiFork"/' "$rc"
          expect "$rc" '"CompanyName", "KazumiFork"'

          cpp=windows/runner/main.cpp
          sed -i 's/L"kazumi\.win\.mutex"/L"kazumi-fork.win.mutex"/' "$cpp"
          expect "$cpp" 'L"kazumi-fork.win.mutex"'
          reject "$cpp" 'kazumi\.win\.mutex'

          # ActivateExistingWindow finds the running window by this title, which
          # window_manager then sets from main.dart, so all three change together.
          # It also stops a second launch from raising upstream Kazumi's window.
          sed -i "s/L\"kazumi\"/L\"$APP_NAME\"/g" "$cpp"
          expect "$cpp" "FindWindow(kWindowClassName, L\"$APP_NAME\")"
          expect "$cpp" "window.Create(L\"$APP_NAME\""
          sed -i "s/title: 'Kazumi',/title: '$APP_NAME',/" lib/main.dart
          expect lib/main.dart "title: '$APP_NAME',"

          sed -i "s/\"FileDescription\", \"kazumi\"/\"FileDescription\", \"$APP_NAME\"/" "$rc"
          expect "$rc" "\"FileDescription\", \"$APP_NAME\""
          expect "$rc" '"ProductName", "kazumi"'

          sed -i "s/CreateDesktopShortcut(L\"Kazumi\", L\"Kazumi - Anime Player\")/CreateDesktopShortcut(L\"$APP_NAME\", L\"$APP_NAME - Anime Player\")/" windows/runner/flutter_window.cpp
          expect windows/runner/flutter_window.cpp "CreateDesktopShortcut(L\"$APP_NAME\""

          app=lib/app_widget.dart
          sed -i "s/title: \"Kazumi\",/title: \"$APP_NAME\",/" "$app"
          sed -i "s/setToolTip('Kazumi')/setToolTip('$APP_NAME')/" "$app"
          sed -i "s/'退出 Kazumi'/'退出 $APP_NAME'/" "$app"
          expect "$app" "title: \"$APP_NAME\","
          expect "$app" "setToolTip('$APP_NAME')"
          expect "$app" "'退出 $APP_NAME'"

      - run: git config --system core.longpaths true

      - uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: ${{ needs.check.outputs.flutter_version }}
          cache: true

      - run: flutter pub get

      - name: Build
        env:
          BUILD_NUMBER: ${{ needs.check.outputs.build_number }}
          DANDANAPI_APPID: ${{ secrets.PUBLIC_DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.PUBLIC_DANDANAPI_KEY }}
        run: >-
          flutter build windows --release
          --build-name=$env:VERSION --build-number=$env:BUILD_NUMBER
          --dart-define=KAZUMI_PUBLIC=true
          --dart-define=KAZUMI_LIBRARY_SERVER=
          "--dart-define=DANDANAPI_APPID=$env:DANDANAPI_APPID"
          "--dart-define=DANDANAPI_KEY=$env:DANDANAPI_KEY"

      - name: Package
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "KazumiPlus_windows_$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: KazumiPlus_windows_*.zip
          if-no-files-found: error
          retention-days: 7

  # Unsigned IPA for sideloading (AltStore, SideStore, TrollStore), packaged the way
  # upstream's release.yaml does it.
  ios:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # iOS app icons aren't in ICON_PATHS yet: add AppIcon.appiconset before branding.
      - name: Public icon
        if: needs.check.outputs.branded == 'true'
        run: |
          cp -R branding/public/. .
          for p in $ICON_PATHS; do
            if [ "$(git hash-object "$p")" = "$(git rev-parse "HEAD:$p")" ]; then
              echo "::error file=$p::still upstream's icon after the copy"
              exit 1
            fi
          done

      # Her TestFlight app is com.kaichuan.kazumi and upstream's IPA is com.example.kazumi;
      # tools that keep the bundle id would otherwise replace one of them. Invite links
      # (kazumi-library://) belong to 一起看, which public builds hide, so the scheme goes.
      - name: Public identity (own bundle id, no invite links)
        run: |
          plist=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" "$plist"
          if [ "$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$plist")" != "$APP_NAME" ]; then
            echo "::error file=$plist::CFBundleDisplayName not set"
            exit 1
          fi
          if grep -q 'kazumi-library' "$plist"; then
            echo "::error file=$plist::kazumi-library scheme still registered"
            exit 1
          fi

          pbx=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com\.example\.kazumi;/PRODUCT_BUNDLE_IDENTIFIER = com.kaichuan.kazumifork;/' "$pbx"
          if [ "$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = com.kaichuan.kazumifork;' "$pbx")" != 3 ] ||
             grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.example.kazumi;' "$pbx"; then
            echo "::error file=$pbx::expected exactly 3 Runner bundle ids patched; did upstream change them?"
            exit 1
          fi

      - uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: ${{ needs.check.outputs.flutter_version }}
          cache: true

      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'pubspec.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - run: flutter pub get

      - run: brew install cmake ninja

      - name: Build
        env:
          BUILD_NUMBER: ${{ needs.check.outputs.build_number }}
          DANDANAPI_APPID: ${{ secrets.PUBLIC_DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.PUBLIC_DANDANAPI_KEY }}
        run: >-
          flutter build ios --release --no-codesign
          --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          --dart-define=KAZUMI_PUBLIC=true
          --dart-define=KAZUMI_LIBRARY_SERVER=
          --dart-define=DANDANAPI_APPID="$DANDANAPI_APPID"
          --dart-define=DANDANAPI_KEY="$DANDANAPI_KEY"

      - name: Package
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -q -r "KazumiPlus_ios_${VERSION}_no_sign.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: KazumiPlus_ios_*_no_sign.ipa
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [check, android, windows, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Exactly the three release files
        run: |
          ls -l dist
          if [ "$(find dist -type f | wc -l)" != 3 ] ||
             [ ! -f "dist/KazumiPlus_android_$VERSION.apk" ] || [ ! -f "dist/KazumiPlus_windows_$VERSION.zip" ] ||
             [ ! -f "dist/KazumiPlus_ios_${VERSION}_no_sign.ipa" ]; then
            echo "::error::dist/ must hold exactly KazumiPlus_android_$VERSION.apk, KazumiPlus_windows_$VERSION.zip and KazumiPlus_ios_${VERSION}_no_sign.ipa"
            exit 1
          fi

      # Fails on any owner host, and when the control string or the AOT binaries are
      # missing, so a scan that read nothing can't pass.
      - name: No owner host in the exact files being published
        run: python3 scripts/scan_public_build.py dist

      - name: No release or draft with this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' | grep -Fxq -- "$VERSION"; then
            echo "::error::a release or draft for $VERSION already exists; delete the old draft first"
            exit 1
          fi

      - name: Release notes
        env:
          NOTES: ${{ inputs.notes }}
          HAS_DANMAKU: ${{ secrets.PUBLIC_DANDANAPI_APPID != '' }}
        run: |
          {
            printf '%s\n' "$NOTES"
            echo
            echo '- Kazumi Plus 是 Kazumi 的非官方修改版，与官方无关，可与官方版同时安装'
            echo '- Windows 首次运行提示「已保护你的电脑」时：更多信息 → 仍要运行'
            echo '- iOS 安装包未签名，需用 AltStore、SideStore 或 TrollStore 等工具自签安装'
            echo '- 国内下载失败时，点「查看详情」用浏览器下载'
            if [ "$HAS_DANMAKU" != true ]; then echo '- 弹幕搜索暂不可用'; fi
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"

      # Drafts get their tag only when published, at target_commitish, so the tag always
      # names the exact source these binaries came from (GPL corresponding source).
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Kazumi Plus ${{ inputs.version }}
          body_path: ${{ runner.temp }}/body.md
          draft: ${{ inputs.draft }}
          make_latest: ${{ !inputs.draft }}
          files: |
            dist/KazumiPlus_android_${{ inputs.version }}.apk
            dist/KazumiPlus_windows_${{ inputs.version }}.zip
            dist/KazumiPlus_ios_${{ inputs.version }}_no_sign.ipa
          fail_on_unmatched_files: true
