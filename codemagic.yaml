# Signed iOS build of this fork for TestFlight (internal testing only). Since build
# 33 this is the fallback for .github/workflows/testflight.yaml; partner_check.py
# keeps the two building the same app.
#
# Upstream's source is built as-is; everything that makes it ours (bundle id,
# export compliance) is applied at build time so `git merge upstream/main`
# never conflicts. The unsigned compile check is ios-check.yaml.

workflows:
  testflight:
    name: Kazumi to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    # No push trigger: start by hand with scripts/codemagic.py start main.
    integrations:
      app_store_connect: NextStop ASC key
    environment:
      flutter: 3.47.7
      xcode: "26.6"
      cocoapods: default
      # code_signing supplies CERT_KEY_B64; kazumi_api supplies our own
      # dandanplay DANDANAPI_APPID / DANDANAPI_KEY. Without them danmaku
      # search returns nothing.
      groups:
        - code_signing
        - kazumi_api
      vars:
        BUNDLE_ID: com.kaichuan.kazumi
    scripts:
      - name: Make the project ours
        script: |
          set -e
          if [ -z "$DANDANAPI_APPID" ] || [ -z "$DANDANAPI_KEY" ]; then
            echo "kazumi_api group is missing DANDANAPI_APPID / DANDANAPI_KEY"
            exit 1
          fi
          pbx=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.example.kazumi;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" "$pbx"
          # Debug, Release and Profile; fail loudly if upstream restructures.
          grep -c "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$pbx" | grep -qx 3

          plist=ios/Runner/Info.plist
          set_key() {
            /usr/libexec/PlistBuddy -c "Delete :$1" "$plist" || true
            /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$plist"
          }
          set_key ITSAppUsesNonExemptEncryption bool false
          # App Store processing (ITMS-90683) rejects builds whose linked
          # plugins reference these APIs without purpose strings, even
          # unused ones. Upstream only ships unsigned IPAs, so never needed them.
          set_key NSPhotoLibraryUsageDescription string "用于选择图片进行以图搜番"
          set_key NSPhotoLibraryAddUsageDescription string "用于将截图保存到相册"
          set_key NSCameraUsageDescription string "用于拍照进行以图搜番"
          set_key NSLocationWhenInUseUsageDescription string "Kazumi 不会读取你的位置"
          /usr/libexec/PlistBuddy -c "Print" "$plist" | grep -E "Usage|Encryption"
      - name: Native build tools
        # ech_http compiles a C++ bridge through a build hook.
        script: brew install cmake ninja || true
      - name: Get packages
        script: flutter pub get
      - name: Create signing files
        script: |
          set -e
          keychain initialize
          # Carried base64 because a PEM pasted into a web form loses its line breaks.
          printf '%s' "$CERT_KEY_B64" | openssl base64 -d -A > "$HOME/cert_key.pem"
          # --create registers the bundle id and a profile if they do not exist yet.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create \
            --certificate-key "@file:$HOME/cert_key.pem"
          keychain add-certificates
      - name: Apply signing settings
        script: |
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --code-signing-setup-verbose-logging
      - name: Build IPA
        script: |
          set -e
          # GitHub uploads too, so Codemagic's own counter is behind; take the next
          # number from App Store Connect, as testflight.yaml does.
          latest=$(app-store-connect get-latest-testflight-build-number 6818711929 --all-versions)
          case "$latest" in
            ''|*[!0-9]*) echo "App Store Connect gave no build number: '$latest'"; exit 1 ;;
          esac
          BUILD_NUMBER=$(( (10#$latest > 32 ? 10#$latest : 32) + 1 ))
          flutter build ipa --release \
            --build-name=3.3.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=DANDANAPI_APPID="${DANDANAPI_APPID:-}" \
            --dart-define=DANDANAPI_KEY="${DANDANAPI_KEY:-}"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
